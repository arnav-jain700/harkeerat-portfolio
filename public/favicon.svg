<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#08090d" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Monogram H with precision tech notches -->
  <path d="M20 18 V46 M44 18 V46 M20 32 H44" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Precision node dots -->
  <circle cx="20" cy="18" r="2.5" fill="#00f5a0" />
  <circle cx="44" cy="18" r="2.5" fill="#6366f1" />
  <circle cx="20" cy="46" r="2.5" fill="#00f5a0" />
  <circle cx="44" cy="46" r="2.5" fill="#6366f1" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>
